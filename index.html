<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Marées">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Marées</title>
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <p class="eyebrow">TARNOS</p>
      <div class="title-row">
        <div>
          <h1 id="pageTitle">Aujourd’hui</h1>
          <p id="fullDate" class="date-line"></p>
        </div>
        <div class="day-nav" aria-label="Changer de jour">
          <button id="previousDay" class="day-arrow" type="button" aria-label="Jour précédent">‹</button>
          <button id="nextDay" class="day-arrow" type="button" aria-label="Jour suivant">›</button>
        </div>
      </div>
      <button id="todayButton" class="today-button" type="button" hidden>Aujourd’hui</button>
    </header>

    <section id="dayRailSection" class="day-rail-section" aria-label="Choisir un jour">
      <div class="day-rail-heading">
        <span>Jours</span>
        <span id="dayRailRange" class="day-rail-range"></span>
      </div>
      <div id="dayRail" class="day-rail" role="list"></div>
    </section>

    <section id="todayView" class="view active" aria-label="Aujourd’hui">
      <article class="hero-card card ocean-card">
        <div class="hero-topline">
          <span id="tideDirection" class="status-pill">—</span>
          <span id="currentTime" class="current-time">—</span>
        </div>
        <p id="nextLabel" class="next-label">PROCHAINE MARÉE</p>
        <div id="countdown" class="countdown">—</div>
        <div class="hero-curve" aria-hidden="true">
          <svg id="heroCurve" viewBox="0 0 320 112" preserveAspectRatio="none" role="presentation">
            <defs>
              <linearGradient id="heroCurveLine" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.58" />
                <stop offset="48%" stop-color="#4cb6ff" stop-opacity="0.95" />
                <stop offset="100%" stop-color="#0a84ff" stop-opacity="0.72" />
              </linearGradient>
              <linearGradient id="heroCurveFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.22" />
                <stop offset="68%" stop-color="#0a84ff" stop-opacity="0.06" />
                <stop offset="100%" stop-color="#0a84ff" stop-opacity="0" />
              </linearGradient>
            </defs>
            <path id="heroCurveFillPath" d="" fill="url(#heroCurveFill)"></path>
            <path id="heroCurvePath" d="" fill="none" stroke="url(#heroCurveLine)" stroke-width="2.5" stroke-linecap="round"></path>
            <circle id="heroCurveMarkerHalo" cx="0" cy="0" r="0" fill="#0a84ff" opacity="0.18"></circle>
            <circle id="heroCurveMarker" cx="0" cy="0" r="0" fill="#f5f5f7" stroke="#0a84ff" stroke-width="2"></circle>
          </svg>
        </div>
        <div class="next-event-row">
          <div>
            <div id="nextDate" class="event-date hero-event-date">—</div>
            <div id="nextTime" class="event-time large">—</div>
            <div id="nextType" class="event-type">—</div>
          </div>
          <div class="event-meta right">
            <strong id="nextHeight">—</strong>
            <span id="nextCoeff">—</span>
          </div>
        </div>
      </article>

      <section class="section-block">
        <h2>Marées</h2>
        <div id="todayEvents" class="events-grid"></div>
      </section>

      <section class="section-block">
        <h2>Soleil</h2>
        <article class="card solar-card sun-card">
          <div class="solar-row dawn"><span>Aube</span><strong id="dawn">—</strong></div>
          <div class="solar-row sunrise"><span>Lever</span><strong id="sunrise">—</strong></div>
          <div class="solar-row sunset"><span>Coucher</span><strong id="sunset">—</strong></div>
          <div class="solar-row dusk">
            <span class="solar-label">Dernières lueurs</span>
            <span class="moon-mark" aria-hidden="true">
              <svg viewBox="0 0 28 28" role="presentation">
                <defs>
                  <linearGradient id="moonSilver" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#f2f5fb" stop-opacity="0.92"/>
                    <stop offset="100%" stop-color="#9ca8bc" stop-opacity="0.76"/>
                  </linearGradient>
                </defs>
                <path d="M20.7 20.8A10.2 10.2 0 0 1 8.1 7.1a10.3 10.3 0 1 0 12.6 13.7Z" fill="url(#moonSilver)"/>
              </svg>
            </span>
            <strong id="dusk">—</strong>
          </div>
        </article>
      </section>
    </section>

    <section id="weekView" class="view" aria-label="Sept jours">
      <p id="weekHint" class="week-hint" hidden>Données de la semaine suivante en attente d’actualisation.</p>
      <div id="weekList" class="week-list"></div>
    </section>
    <footer class="data-footer">
      <span id="dataStatus"></span>
      <a href="https://api-maree.fr/" target="_blank" rel="noreferrer">api-maree.fr</a>
      <span>·</span>
      <a href="https://sunrisesunset.io/" target="_blank" rel="noreferrer">SunriseSunset.io</a>
    </footer>
  </main>

  <nav class="tab-bar" aria-label="Navigation principale">
    <button class="tab active" data-view="todayView" aria-current="page">
      <span class="tab-icon">◉</span><span>Aujourd’hui</span>
    </button>
    <button class="tab" data-view="weekView">
      <span class="tab-icon">▦</span><span>7 jours</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
